# Трейс. Локализуются только ведущие метки; расстояния/единицы технические.
help.long: ".trace — число хопов и расстояние от последнего пинга\n.trace full — все пути, по которым слышно сообщение (сбор несколько секунд)"
direct: "Трейс напрямую"
hops: "Трейс %d хоп(ов)"
# .trace full. Строки путей ([хэш] задержка + полный км пути) технические;
# задержка считается от первой услышанной копии.
full.paths: "путей: %d за %dс"
full.direct: "[direct]"
full.sec: "(%.1fс)"
full.first: "(*)"
full.km: "%.1fкм"
full.m: "%.0fм"
full.none: "других копий не слышно"
full.busy: "трейс занят, попробуйте позже"
full.usage: ".trace [full]"
