# .room — DM-based room service. Placeholders keep order; %d counts, %s names/text.
help.long: ".room - статус комнаты\n.room send <текст> - написать в комнату\n.room get [n] - прочитать непрочитанное\n.room last [n] - последние посты\n.room on / .room off - подписка на новые посты\n.room who - кто в комнате\n.room list - список комнат\n.room <имя> <команда> ... - выполнить команду в другой комнате"
need_dm: "Комната работает в личке — напишите мне напрямую."
need_key: "Комната недоступна: я ещё не знаю ваш advert. Сначала напишите мне в личку."
unknown: "Неизвестная команда .room. Попробуйте: send / get / last / on / off / who / list"
usage.send: "Использование: .room send <текст>"
err.load: "ERR: не удалось загрузить комнату"
err.save: "ERR: не удалось сохранить комнату"
err.no_room: "Нет такой комнаты. .room list покажет список."
sent: "Отправлено [%d]. Непрочитано: %d"
sent.in: "Отправлено [%d] в %s. Непрочитано: %d"
get.none: "Непрочитанных нет."
get.more: "+%d ещё: .room get"
sub.on: "Подписка включена. Непрочитано: %d. Новые посты будут приходить в личку."
sub.off: "Подписка выключена. Непрочитанное копится для .room get."
sub.on_short: "вкл"
sub.off_short: "выкл"
status: "Комната %s: %s | непрочитано %d | всего постов: %d"
list.header: "Комнаты:"
list.line: "%s [%s] непрочитано %d"
empty: "Комната пуста. .room send <текст> — начать."
