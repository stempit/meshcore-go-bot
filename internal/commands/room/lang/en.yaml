# .room — DM-based room service. Placeholders keep order; %d counts, %s names/text.
help.long: ".room - room status (subscribed? unread? last post)\n.room send <text> - post to the room\n.room get [n] - fetch unread posts (default 10)\n.room last [n] - read last posts\n.room on / .room off - subscribe / unsubscribe to new posts\n.room who - who is in the room\n.room list - list rooms\n.room <name> <verb> ... - run the command in another room"
need_dm: "The room works in DMs — message me directly."
need_key: "Cannot use the room: I don't know your advert yet. Send me a DM first."
unknown: "Unknown .room command. Try: send / get / last / on / off / who / list"
usage.send: "Usage: .room send <text>"
err.load: "ERR: cannot load room"
err.save: "ERR: cannot save room"
err.no_room: "No such room. .room list shows the rooms."
sent: "Posted [%d]. Unread: %d"
sent.in: "Posted [%d] in %s. Unread: %d"
get.none: "No unread posts."
get.more: "+%d more: .room get"
sub.on: "Subscribed. Unread: %d. New posts arrive as DMs."
sub.off: "Unsubscribed. Unread keeps counting for .room get."
sub.on_short: "on"
sub.off_short: "off"
status: "Room %s: %s | unread %d | %d posts total"
list.header: "Rooms:"
list.line: "%s [%s] unread %d"
empty: "The room is empty. .room send <text> starts it."
post.line: "[%d] %s (%s): %s"
ago.now: "now"
ago.min: "%dm ago"
ago.hour: "%dh ago"
ago.day: "%dd ago"
who.none: "Nobody in the room yet."
who.no_subs: "In the room (%d, none listening): %s"
who: "Listening (%d): %s | others (%d): %s"
